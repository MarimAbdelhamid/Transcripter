name: Deploy to GitHub Pages

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        run: |
          git clone "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" repo
          cd repo
          git checkout ${{ github.sha }}

      - name: Deploy to gh-pages branch
        run: |
          cd repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Create an orphan branch with only the site files
          git checkout --orphan gh-pages
          git rm -rf . --quiet

          # Copy back only the files needed for the site
          git checkout ${{ github.sha }} -- index.html style.css script.js

          # Prevent Jekyll processing
          touch .nojekyll

          git add index.html style.css script.js .nojekyll
          git commit -m "Deploy site from ${{ github.sha }}"
          git push -f origin gh-pages
